name: 每日盤前沙盤推演

on:
  schedule:
    # 台灣時間早上 8 點 = 世界標準時間 (UTC) 凌晨 0 點
    # 1-5 代表星期一到星期五
    - cron: '0 0 * * 1-5'
  workflow_dispatch: # 這個設定讓姊姊可以在 GitHub 網頁上手動點擊測試！

jobs:
  run-robot:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 下載姊姊的程式碼
      uses: actions/checkout@v3

    - name: 2. 準備 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 3. 安裝需要的工具包 (函式庫)
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests yfinance FinMind

    - name: 4. 執行股票機器人！
      run: python adr_check.py
